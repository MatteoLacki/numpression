[package]
name = "numpression"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MS-Numpress encoding and decoding (linear, pic, slof) for mass spectrometry data, in safe Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/MatteoLacki/numpression"
documentation = "https://docs.rs/numpression"
keywords = ["numpress", "mass-spectrometry", "proteomics", "mzml", "compression"]
categories = ["compression", "science"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE", "README.md", "THEORY.md"]

[dependencies]

[dev-dependencies]
numpress-rs = "1.1.1"
